name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  ci:
    name: Lint · Type-check · Test · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint || true  # non-blocking until ESLint config is complete

      - name: Type-check
        run: npm run typecheck

      - name: i18n parity check
        run: npm run i18n:check

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://idaara-flame.vercel.app
          # Add GROQ_API_KEY and GEMINI_API_KEY from GitHub Secrets if needed for build
